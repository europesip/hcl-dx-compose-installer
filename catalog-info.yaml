# ─────────────────────────────────────────────────────────────────────────────────────────────────────────────────────
# catalog-info.yaml · Entry of this repository in the EUROPESIP developer portal (Backstage)
#
# What it is for
#   Backstage (https://backstage.k3s.europesip.com) is the internal developer portal (IDP) of EUROPESIP: a catalog of
#   every product, service and repository, with its owner, its links and how it relates to the rest. Backstage reads
#   the GitHub organization "europesip" through the read-only GitHub App "europesip-backstage" and creates a catalog
#   entry for every repository that has THIS file at its root. Without it, the repository does not appear on its own.
#
# What it is NOT
#   It is not used by the wizard, by its build, by its container image or by its Helm chart: changing or deleting it
#   only changes how the repository is shown in Backstage (picked up within about 30 minutes).
#
# Format: Backstage descriptor format, https://backstage.io/docs/features/software-catalog/descriptor-format
# ─────────────────────────────────────────────────────────────────────────────────────────────────────────────────────
apiVersion: backstage.io/v1alpha1
kind: Component                       # a piece of software that is built and deployed (here, a web application)
metadata:
  name: dx-installer-wizard           # unique id in the catalog (lower case, no spaces); other entities point to it
  title: DX Installer Wizard, by EuropeSIP   # name shown in Backstage (never "HCL DX Compose Installer": not an HCL product)
  description: >-
    Web wizard by EuropeSIP that generates a ready-to-run installation of HCL DX Compose (k3s, OpenShift, AWS EKS/ROSA)
    with its optional pieces: LDAP, Keycloak, OpenBao, Argo CD, the Script Application operator and the webinar labs.
  tags: [hcl-dx, dx-compose, installer, kubernetes, helm]    # free labels, used by the catalog search and filters
  annotations:
    # GitHub repository of this component: Backstage uses it for the links and the GitHub cards of the entity page
    github.com/project-slug: europesip/hcl-dx-compose-installer
    # where the source lives (the "View source" button)
    backstage.io/source-location: url:https://github.com/europesip/hcl-dx-compose-installer/tree/main/
  links:                              # buttons in the "Links" card of the entity page
    - { url: 'https://github.com/europesip/hcl-dx-compose-installer#readme', title: README, icon: docs }
    - { url: 'https://github.com/europesip/hcl-dx-compose-installer/tree/main/docs', title: Documentation, icon: docs }
    - { url: 'https://github.com/europesip/hcl-dx-compose-installer/releases', title: Releases }
    - { url: 'https://github.com/orgs/europesip/projects/1', title: Roadmap (GitHub project) }
spec:
  type: website                       # kind of component: it is a web application with its own server
  lifecycle: production               # experimental | production | deprecated
  owner: plataforma                   # team that answers for it (a Group of the catalog)
  system: productos-europesip         # the larger system it belongs to: EUROPESIP products published on GitHub
