name: build
# Tests, container image (amd64 + arm64) and Helm chart.
#   push to main  -> image :main
#   tag vX.Y.Z    -> image :X.Y.Z, :X.Y, :latest and the chart oci://ghcr.io/europesip/charts/hcl-dx-compose-installer
on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  IMAGE: ghcr.io/europesip/hcl-dx-compose-installer
  CHARTS: oci://ghcr.io/europesip/charts

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/checkout@v7
        with: {repository: europesip/hcl-dx-compose-labs, path: labs}
      - uses: actions/setup-node@v6
        with: {node-version: 24, cache: npm}
      - run: npm ci
      - name: Same version in package.json and the chart
        run: |
          p=$(node -p 'require("./package.json").version')
          c=$(sed -n 's/^appVersion: "\(.*\)"/\1/p' chart/hcl-dx-compose-installer/Chart.yaml)
          echo "package=$p chart=$c"; [ "$p" = "$c" ]
      - name: Unit tests
        run: npm test
      - name: Golden test against the frozen wizard of the labs (same lab files and commands)
        run: |
          npx playwright install --with-deps chromium
          WIZARD=labs/docs/index.html node test/golden.e2e.mjs
      - run: npm run build

  image:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4
      - name: Build for the test
        uses: docker/build-push-action@v7
        with:
          context: .
          load: true
          tags: test:installer
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Test the container (non-root, read-only root file system, tools, headers, API, UI)
        run: |
          docker run -d --name inst -p 8080:8080 --read-only --tmpfs /tmp --user 12345:0 --cap-drop ALL test:installer
          for i in $(seq 1 30); do curl -sf localhost:8080/healthz && break; sleep 1; done
          docker exec inst sh -c 'aws --version && eksctl version && rosa version && oc version --client && kubectl version --client && helm version --short'
          docker exec -e LD_PRELOAD=/usr/local/lib/libnss_wrapper.so -e NSS_WRAPPER_PASSWD=/tmp/dx-installer/passwd -e NSS_WRAPPER_GROUP=/etc/group inst ssh -V   # as the AWS jobs run it
          curl -sI localhost:8080/ | tee h.txt
          grep -qi "content-security-policy:.*connect-src 'self'" h.txt
          grep -qi "x-content-type-options: nosniff" h.txt
          curl -sf localhost:8080/ | grep -q '<div id="root">'
          curl -sf localhost:8080/api/info | grep -q '"aws":true'
          curl -sf localhost:8080/api/aws/scripts.zip -o s.zip && unzip -l s.zip | grep -q ec2-create.sh
          npm ci && npx playwright install --with-deps chromium
          node test/ui.e2e.mjs http://localhost:8080/ /tmp/e2e
          ls -la /tmp/e2e; test -s /tmp/e2e/dx-compose-webinar.zip; test -s /tmp/e2e/Guion-webinar-DX-Compose.docx; test -s /tmp/e2e/Guion-webinar-DX-Compose.pdf; test -s /tmp/e2e/dx-compose-install.zip
          unzip -l /tmp/e2e/dx-compose-webinar.zip | grep -E "prepare.sh|demo.sh|RUNBOOK.md|Guion-webinar"
          unzip -l /tmp/e2e/dx-compose-install.zip | grep -E "install.sh|RUNBOOK.md"
          docker rm -f inst
      - uses: actions/upload-artifact@v5
        if: always()
        with: {name: ui-e2e, path: /tmp/e2e, if-no-files-found: ignore}
      - uses: docker/metadata-action@v6
        id: meta
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') }}
      - uses: docker/login-action@v4
        if: github.event_name != 'pull_request'
        with: {registry: ghcr.io, username: "${{ github.actor }}", password: "${{ secrets.GITHUB_TOKEN }}"}
      - name: Build and publish (amd64 + arm64)
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: VERSION=${{ steps.meta.outputs.version }}
          cache-from: type=gha

  chart:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: azure/setup-helm@v5
      - name: Lint and render
        run: |
          C=chart/hcl-dx-compose-installer
          helm lint $C
          helm template t $C > /dev/null
          helm template t $C --set ingress.enabled=true --set ingress.tls.enabled=true --set auth.enabled=true \
            --set auth.username=u --set auth.password=p --set networkPolicy.enabled=true --set podDisruptionBudget.enabled=true > /dev/null
          helm template t $C --set aws.enabled=false --set networkPolicy.enabled=true | grep -q 'egress: \[\]'
          ! helm template t $C --set auth.enabled=true 2>/dev/null     # auth needs a secret or a user and password
      - name: Publish (tags only, and only a chart version that is not published yet)
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | helm registry login ghcr.io -u "${{ github.actor }}" --password-stdin
          v=$(helm show chart chart/hcl-dx-compose-installer | sed -n 's/^version: //p')
          if helm show chart "$CHARTS/hcl-dx-compose-installer" --version "$v" >/dev/null 2>&1; then
            echo "chart $v is already published: not overwritten"; exit 0
          fi
          helm package chart/hcl-dx-compose-installer
          helm push hcl-dx-compose-installer-$v.tgz "$CHARTS"
