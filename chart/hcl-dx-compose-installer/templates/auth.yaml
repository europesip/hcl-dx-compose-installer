{{- if and .Values.auth.enabled (not .Values.auth.existingSecret) }}
{{- if or (not .Values.auth.username) (not .Values.auth.password) }}
{{- fail "auth.enabled needs auth.existingSecret, or auth.username and auth.password" }}
{{- end }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "installer.authSecret" . }}
  labels: {{- include "installer.labels" . | nindent 4 }}
type: Opaque
stringData:
  username: {{ .Values.auth.username | quote }}
  password: {{ .Values.auth.password | quote }}
{{- end }}
