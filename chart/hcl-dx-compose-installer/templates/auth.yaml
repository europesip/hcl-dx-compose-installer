{{- if .Values.auth.enabled }}
{{- if and (not .Values.auth.existingSecret) (not .Values.auth.htpasswd) }}
{{- fail "auth.enabled needs auth.existingSecret or auth.htpasswd" }}
{{- end }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "installer.fullname" . }}-auth
  labels: {{- include "installer.labels" . | nindent 4 }}
data:
  auth.conf: |
    auth_basic {{ .Values.auth.realm | quote }};
    auth_basic_user_file /etc/nginx/htpasswd/htpasswd;
{{- if not .Values.auth.existingSecret }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "installer.authSecret" . }}
  labels: {{- include "installer.labels" . | nindent 4 }}
type: Opaque
stringData:
  htpasswd: {{ .Values.auth.htpasswd | quote }}
{{- end }}
{{- end }}
