{{- if .Values.networkPolicy.enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "installer.fullname" . }}
  labels: {{- include "installer.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels: {{- include "installer.selector" . | nindent 6 }}
  policyTypes: [Ingress, Egress]
  ingress:
    - ports: [{port: 8080, protocol: TCP}]
      {{- with .Values.networkPolicy.from }}
      from: {{- toYaml . | nindent 8 }}
      {{- end }}
  {{- if .Values.aws.enabled }}
  egress:
    - ports: [{port: 53, protocol: UDP}, {port: 53, protocol: TCP}]
    - to: [{ipBlock: {cidr: 0.0.0.0/0}}]
      ports: [{port: 443, protocol: TCP}, {port: 22, protocol: TCP}, {port: 6443, protocol: TCP}, {port: 80, protocol: TCP}]
  {{- else }}
  egress: []                   # without AWS the pod never needs to connect anywhere
  {{- end }}
{{- end }}
