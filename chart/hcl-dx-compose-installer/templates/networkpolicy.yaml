{{- if .Values.networkPolicy.enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "installer.fullname" . }}
  labels: {{- include "installer.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels: {{- include "installer.selector" . | nindent 6 }}
  policyTypes: [Ingress, Egress]
  ingress:
    - ports: [{port: 8080, protocol: TCP}]
      {{- with .Values.networkPolicy.from }}
      from: {{- toYaml . | nindent 8 }}
      {{- end }}
  egress: []                   # the page is static: the pod never needs to connect anywhere
{{- end }}
