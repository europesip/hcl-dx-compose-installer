apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "installer.fullname" . }}
  labels: {{- include "installer.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels: {{- include "installer.selector" . | nindent 6 }}
  template:
    metadata:
      labels: {{- include "installer.selector" . | nindent 8 }}
        {{- with .Values.podLabels }}{{ toYaml . | nindent 8 }}{{ end }}
      annotations:
        {{- if .Values.auth.enabled }}
        checksum/auth: {{ include (print $.Template.BasePath "/auth.yaml") . | sha256sum }}
        {{- end }}
        {{- with .Values.podAnnotations }}{{ toYaml . | nindent 8 }}{{ end }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets: {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.priorityClassName }}
      priorityClassName: {{ . }}
      {{- end }}
      automountServiceAccountToken: false
      securityContext: {{- toYaml .Values.podSecurityContext | nindent 8 }}
      containers:
        - name: installer
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          securityContext: {{- toYaml .Values.securityContext | nindent 12 }}
          ports:
            - name: http
              containerPort: 8080
          readinessProbe:
            httpGet: {path: /healthz, port: http}
            periodSeconds: 10
          livenessProbe:
            httpGet: {path: /healthz, port: http}
            periodSeconds: 30
          env:
            - {name: AWS_ENABLED, value: {{ .Values.aws.enabled | quote }}}
            - {name: APP_VERSION, value: {{ .Chart.AppVersion | quote }}}
            {{- if .Values.auth.enabled }}
            - name: AUTH_USER
              valueFrom: {secretKeyRef: {name: {{ include "installer.authSecret" . }}, key: username}}
            - name: AUTH_PASSWORD
              valueFrom: {secretKeyRef: {name: {{ include "installer.authSecret" . }}, key: password}}
            {{- end }}
          resources: {{- toYaml .Values.resources | nindent 12 }}
          volumeMounts:
            - {name: tmp, mountPath: /tmp}
      volumes:
        - name: tmp
          emptyDir: {sizeLimit: {{ .Values.workDir.sizeLimit }}}
      {{- with .Values.nodeSelector }}
      nodeSelector: {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity: {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations: {{- toYaml . | nindent 8 }}
      {{- end }}
