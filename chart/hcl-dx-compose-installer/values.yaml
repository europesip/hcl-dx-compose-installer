# DX Installer Wizard: the web page and its server. The installation (scripts, RUNBOOK, Word
# script) is generated in the browser; the server only runs the AWS scripts when someone creates or
# deletes an AWS environment from the page.

image:
  repository: ghcr.io/europesip/hcl-dx-compose-installer
  tag: ""                      # default: the chart appVersion
  pullPolicy: IfNotPresent
imagePullSecrets: []           # e.g. [{name: regcred}] for a private registry or a mirror

replicaCount: 1
nameOverride: ""
fullnameOverride: ""

service:
  type: ClusterIP              # ClusterIP | NodePort | LoadBalancer
  port: 80
  nodePort: null               # only with type NodePort
  annotations: {}

# Kubernetes Ingress
ingress:
  enabled: false
  className: ""                # traefik, nginx... (empty: the default IngressClass)
  annotations: {}
  host: installer.example.com
  path: /
  pathType: Prefix
  tls:
    enabled: false
    secretName: ""             # existing TLS Secret for the host (empty: the controller's default certificate)

# OpenShift Route (instead of the Ingress)
route:
  enabled: false
  host: ""                     # empty: generated by the router
  tls:
    termination: edge          # edge | reencrypt | passthrough is not supported (the pod serves HTTP)
    insecureEdgeTerminationPolicy: Redirect

# Optional HTTP basic authentication in front of the page and its API
auth:
  enabled: false
  existingSecret: ""           # Secret with the keys "username" and "password"
  username: ""                 # or the user and password here (the chart creates the Secret)
  password: ""

# Create and delete AWS environments from the page (EC2 + k3s, EKS, ROSA). The pod then needs
# outbound access to the AWS APIs (see networkPolicy.egress). false hides the option and the API.
aws:
  enabled: true

# Space for the AWS jobs (SSH key, kubeconfig and logs of the environments created from the page).
# An emptyDir: it is lost when the pod restarts (the AWS resources are found again by their tag).
workDir:
  sizeLimit: 1Gi

resources:
  requests:
    cpu: 20m
    memory: 96Mi
  limits:
    cpu: "1"
    memory: 768Mi

# Runs as non-root with a read-only root file system; no fixed UID, so it also runs under the
# OpenShift restricted-v2 SCC (random UID).
podSecurityContext:
  runAsNonRoot: true
  seccompProfile:
    type: RuntimeDefault
securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop: ["ALL"]

podAnnotations: {}
podLabels: {}
nodeSelector: {}
tolerations: []
affinity: {}
priorityClassName: ""

# Only lets in traffic to the pod port (from anywhere, or from the namespaces/pods you list).
# Outbound: DNS and HTTPS/SSH to the Internet when aws.enabled (AWS APIs, the EC2 instance, the
# Kubernetes API of the new cluster on 6443); nothing when AWS is disabled.
networkPolicy:
  enabled: false
  from: []                     # e.g. [{namespaceSelector: {matchLabels: {kubernetes.io/metadata.name: traefik}}}]

podDisruptionBudget:
  enabled: false
  minAvailable: 1
