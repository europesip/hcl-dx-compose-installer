# HCL DX Compose Installer. The page is static: everything is generated in the user's browser and
# nothing typed in it (credentials included) reaches this pod or any other server.

image:
  repository: ghcr.io/europesip/hcl-dx-compose-installer
  tag: ""                      # default: the chart appVersion
  pullPolicy: IfNotPresent
imagePullSecrets: []           # e.g. [{name: regcred}] for a private registry or a mirror

replicaCount: 1
nameOverride: ""
fullnameOverride: ""

service:
  type: ClusterIP              # ClusterIP | NodePort | LoadBalancer
  port: 80
  nodePort: null               # only with type NodePort
  annotations: {}

# Kubernetes Ingress
ingress:
  enabled: false
  className: ""                # traefik, nginx... (empty: the default IngressClass)
  annotations: {}
  host: installer.example.com
  path: /
  pathType: Prefix
  tls:
    enabled: false
    secretName: ""             # existing TLS Secret for the host (empty: the controller's default certificate)

# OpenShift Route (instead of the Ingress)
route:
  enabled: false
  host: ""                     # empty: generated by the router
  tls:
    termination: edge          # edge | reencrypt | passthrough is not supported (the pod serves HTTP)
    insecureEdgeTerminationPolicy: Redirect

# Optional HTTP basic authentication in front of the page
auth:
  enabled: false
  existingSecret: ""           # Secret with a key "htpasswd" (htpasswd -nbB user password)
  htpasswd: ""                 # or the htpasswd line here (the chart creates the Secret)
  realm: "HCL DX Compose Installer"

resources:
  requests:
    cpu: 10m
    memory: 32Mi
  limits:
    cpu: 200m
    memory: 128Mi

# Runs as non-root with a read-only root file system; no fixed UID, so it also runs under the
# OpenShift restricted-v2 SCC (random UID).
podSecurityContext:
  runAsNonRoot: true
  seccompProfile:
    type: RuntimeDefault
securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop: ["ALL"]

podAnnotations: {}
podLabels: {}
nodeSelector: {}
tolerations: []
affinity: {}
priorityClassName: ""

# Only lets in traffic to the pod port (from anywhere, or from the namespaces/pods you list)
networkPolicy:
  enabled: false
  from: []                     # e.g. [{namespaceSelector: {matchLabels: {kubernetes.io/metadata.name: traefik}}}]

podDisruptionBudget:
  enabled: false
  minAvailable: 1
